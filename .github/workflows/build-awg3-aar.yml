name: Build official AmneziaWG 3.1.20260814 AAR

on:
  push:
    branches:
      - tooling/awg3-aar-v3.1.20260814

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tooling branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone official AmneziaWG Android v3.1.20260814
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.1.20260814 --recurse-submodules https://github.com/amnezia-vpn/amneziawg-android.git awg3

      - name: Build tunnel AAR
        shell: bash
        working-directory: awg3
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :tunnel:assembleRelease
          test -f tunnel/build/outputs/aar/tunnel-release.aar
          sha256sum tunnel/build/outputs/aar/tunnel-release.aar | tee tunnel-release.aar.sha256

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-android-v3.1.20260814-aar
          path: |
            awg3/tunnel/build/outputs/aar/tunnel-release.aar
            awg3/tunnel-release.aar.sha256
          if-no-files-found: error
